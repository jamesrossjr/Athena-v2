name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: 'RC number (e.g., 1)'
        required: true
        type: number
      skip_ios:
        description: 'Skip iOS build'
        required: false
        type: boolean
        default: false
      skip_android:
        description: 'Skip Android build'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-id: ${{ steps.build-id.outputs.build-id }}
      tag-name: ${{ steps.tag.outputs.tag-name }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.0
          
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Generate build ID
        id: build-id
        run: |
          BUILD_ID=$(date +'%Y%m%d')-$(printf "%03d" ${{ github.run_number }})
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          
      - name: Generate tag name
        id: tag
        run: |
          TAG_NAME=v${{ steps.version.outputs.version }}-rc.${{ inputs.rc_number }}
          echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT

  web-build:
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

      - name: Build web application
        run: pnpm build
        env:
          NODE_ENV: production
          NUXT_APP_VERSION: ${{ needs.prepare.outputs.version }}
          NUXT_APP_BUILD_ID: ${{ needs.prepare.outputs.build-id }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build-id }}
          path: .output/

  ios-build:
    runs-on: macos-14
    needs: [prepare, web-build]
    if: ${{ !inputs.skip_ios }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build-id }}
          path: .output/

      - name: Setup Capacitor iOS
        run: |
          pnpm cap:sync
          npx cap add ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./ios

      - name: Setup iOS certificates
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          cd ios
          bundle exec fastlane match development --readonly
          bundle exec fastlane match appstore --readonly

      - name: Build iOS app
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd ios
          bundle exec fastlane build_rc version:${{ needs.prepare.outputs.version }} build_number:${{ needs.prepare.outputs.build-id }}

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build-id }}
          path: ios/build/*.ipa

  android-build:
    runs-on: ubuntu-latest
    needs: [prepare, web-build]
    if: ${{ !inputs.skip_android }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build-id }}
          path: .output/

      - name: Setup Capacitor Android
        run: |
          pnpm cap:sync
          npx cap add android

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./android

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 -d > android/app/release.keystore

      - name: Build Android app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          bundle exec fastlane build_rc version:${{ needs.prepare.outputs.version }} build_number:${{ needs.prepare.outputs.build-id }}

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build-id }}
          path: android/app/build/outputs/bundle/release/*.aab

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, web-build, ios-build, android-build]
    if: always() && (needs.web-build.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.0

      - name: Setup Git
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@canvas-mvp.com"

      - name: Create and push tag
        run: |
          git tag -a ${{ needs.prepare.outputs.tag-name }} -m "Canvas MVP RC ${{ inputs.rc_number }}"
          git push origin ${{ needs.prepare.outputs.tag-name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag-name }}
          name: "Canvas MVP RC ${{ inputs.rc_number }}"
          body: |
            ## Canvas MVP Release Candidate ${{ inputs.rc_number }}
            
            **Version:** ${{ needs.prepare.outputs.version }}  
            **Build ID:** ${{ needs.prepare.outputs.build-id }}  
            **Branch:** release/v0.1.0
            
            ### What's included:
            - ✅ Web application build
            - ${{ needs.ios-build.result == 'success' && '✅' || needs.ios-build.result == 'skipped' && '⏭️' || '❌' }} iOS app (.ipa)
            - ${{ needs.android-build.result == 'success' && '✅' || needs.android-build.result == 'skipped' && '⏭️' || '❌' }} Android app (.aab)
            
            ### Testing:
            - [ ] Web app smoke test
            - [ ] iOS TestFlight testing
            - [ ] Android Play Internal testing
            - [ ] QA sign-off
            
            **⚠️ This is a release candidate - not for production use**
          draft: true
          prerelease: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify team
        if: success()
        run: |
          echo "🚀 RC ${{ inputs.rc_number }} created successfully!"
          echo "Tag: ${{ needs.prepare.outputs.tag-name }}"
          echo "Artifacts ready for QA testing"